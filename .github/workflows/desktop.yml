name: Desktop build (Windows)

on:
  push:
    branches: [main]
    paths: ["src/**", "omniview.py", "requirements.txt", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["src/**", "omniview.py", "requirements.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Argos (offline translation) pulls in PyTorch, which would make the download
      # several GB. The packaged app translates online (Google) instead; run from source
      # for offline translation.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pytesseract opencv-python-headless numpy mss deep-translator langdetect pynput pyinstaller

      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Build app
        run: >
          pyinstaller --noconfirm --windowed --name OmniViewTranslator
          --paths . --collect-data langdetect --collect-submodules pynput
          --hidden-import src.app omniview.py

      - name: Bundle Tesseract and language packs
        shell: pwsh
        run: |
          $dest = "dist/OmniViewTranslator/tesseract"
          Copy-Item "C:\Program Files\Tesseract-OCR" $dest -Recurse
          $langs = "eng","ind","msa","spa","por","fra","deu","ita","nld","rus","ukr","pol","tur",
                   "ara","hin","tha","vie","jpn","kor","chi_sim","chi_tra"
          foreach ($lang in $langs) {
            $file = "$dest/tessdata/$lang.traineddata"
            if (-not (Test-Path $file)) {
              Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $file
            }
          }
          Get-ChildItem "$dest/tessdata" -Filter *.traineddata | Select-Object Name, Length

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/OmniViewTranslator/OmniViewTranslator.exe" `
                -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/OmniViewTranslator -DestinationPath OmniViewTranslator-windows.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: omniview-translator-windows
          path: OmniViewTranslator-windows.zip

  publish:
    name: Publish latest Windows build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: omniview-translator-windows
          path: app

      - name: Update "desktop-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Windows app (latest build)
          prerelease: true
          files: app/*.zip
          body: >
            Latest Windows build of OmniView Translator from main. Unzip it and run
            OmniViewTranslator.exe. Tesseract OCR and its language packs are included.
